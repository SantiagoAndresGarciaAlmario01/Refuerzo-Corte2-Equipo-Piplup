<text x="1715.0" y="412" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Sistema de Alertas</text>
<text x="1715.0" y="432" font-size="12" fill="#fff" opacity=".85" text-anchor="middle">[Sistema externo]</text>
<text x="1715.0" y="456" font-size="12.5" fill="#fff" text-anchor="middle">Distribuye alertas push/SMS</text>
<text x="1715.0" y="473" font-size="12.5" fill="#fff" text-anchor="middle">a técnicos y supervisores.</text>
<g filter="url(#sh)"><rect x="1560" y="600" width="310" height="130" rx="12" fill="#8A99AD"/></g>
<text x="1715.0" y="632" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Centro de Control ECI</text>
<text x="1715.0" y="652" font-size="12" fill="#fff" opacity=".85" text-anchor="middle">[Sistema externo]</text>
<text x="1715.0" y="676" font-size="12.5" fill="#fff" text-anchor="middle">Registra misiones y autoriza</text>
<text x="1715.0" y="693" font-size="12.5" fill="#fff" text-anchor="middle">rutas acuáticas entre zonas.</text>
<g filter="url(#sh)"><rect x="1560" y="820" width="310" height="130" rx="12" fill="#8A99AD"/></g>
<text x="1715.0" y="852" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Sistema del Laboratorio (LIMS)</text>
<text x="1715.0" y="872" font-size="12" fill="#fff" opacity=".85" text-anchor="middle">[Sistema externo]</text>
<text x="1715.0" y="896" font-size="12.5" fill="#fff" text-anchor="middle">Recibe la muestra y valida su</text>
<text x="1715.0" y="913" font-size="12.5" fill="#fff" text-anchor="middle">cadena de custodia.</text>
<g filter="url(#sh)"><rect x="1560" y="1040" width="310" height="130" rx="12" fill="#8A99AD"/></g>
<text x="1715.0" y="1072" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">API Condiciones Hídricas</text>
