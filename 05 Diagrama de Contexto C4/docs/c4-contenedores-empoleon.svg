<text x="910.0" y="1032" font-size="12" fill="#fff" opacity=".85" text-anchor="middle">[Contenedor: PostgreSQL]</text>
<text x="910.0" y="1054" font-size="12.5" fill="#fff" text-anchor="middle">Misiones, tramos, planes y registros</text>
<text x="910.0" y="1071" font-size="12.5" fill="#fff" text-anchor="middle">de custodia sellados (SHA-256).</text>
