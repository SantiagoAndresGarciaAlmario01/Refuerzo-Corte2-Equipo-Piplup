<rect width="1900" height="1240" fill="#fff"/>
<text x="40" y="52" font-size="30" font-weight="700" fill="#0A1F3C">[Diagrama de Contenedores C4 – Nivel 2] AquaPort Enterprise (Empoleon)</text>
<text x="40" y="82" font-size="16" fill="#5A6B7F">60 drones · 4 zonas hídricas interconectadas · rutas multi-etapa con waypoints · cada flecha indica dato y protocolo</text>
<rect x="300" y="355" width="1190" height="805" rx="16" fill="#F5F9FD" stroke="#1168BD" stroke-width="2" stroke-dasharray="10 8"/>
<text x="322" y="1145" font-size="15" fill="#1168BD" font-weight="700">AquaPort Enterprise [Sistema de software]</text>
<g filter="url(#sh)"><circle cx="470" cy="162" r="36" fill="#08427B"/><rect x="335" y="196" width="270" height="118" rx="34" fill="#08427B"/></g>
<text x="470" y="232" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Solicitante</text>
<text x="470" y="251" font-size="12" fill="#CFE0F2" text-anchor="middle">[Persona]</text>
<text x="470" y="274" font-size="12.5" fill="#fff" text-anchor="middle">Pide misiones multi-etapa</text>
<text x="470" y="291" font-size="12.5" fill="#fff" text-anchor="middle">con muestras y sensores.</text>
<g filter="url(#sh)"><circle cx="910" cy="162" r="36" fill="#08427B"/><rect x="775" y="196" width="270" height="118" rx="34" fill="#08427B"/></g>
<text x="910" y="232" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Operador Hídrico</text>
<text x="910" y="251" font-size="12" fill="#CFE0F2" text-anchor="middle">[Persona]</text>
<text x="910" y="274" font-size="12.5" fill="#fff" text-anchor="middle">Supervisa rutas, tramos</text>
<text x="910" y="291" font-size="12.5" fill="#fff" text-anchor="middle">y reasignaciones.</text>
<g filter="url(#sh)"><circle cx="1300" cy="162" r="36" fill="#08427B"/><rect x="1165" y="196" width="270" height="118" rx="34" fill="#08427B"/></g>
<text x="1300" y="232" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Administrador ECI</text>
<text x="1300" y="251" font-size="12" fill="#CFE0F2" text-anchor="middle">[Persona]</text>
<text x="1300" y="274" font-size="12.5" fill="#fff" text-anchor="middle">Gestiona la flota de 60</text>
<text x="1300" y="291" font-size="12.5" fill="#fff" text-anchor="middle">drones y las 4 zonas.</text>
<g filter="url(#sh)"><circle cx="1715" cy="162" r="36" fill="#08427B"/><rect x="1580" y="196" width="270" height="118" rx="34" fill="#08427B"/></g>
<text x="1715" y="232" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Técnico de Mantenimiento</text>
<text x="1715" y="251" font-size="12" fill="#CFE0F2" text-anchor="middle">[Persona]</text>
<text x="1715" y="274" font-size="12.5" fill="#fff" text-anchor="middle">Atiende drones en FALLO</text>
<text x="1715" y="291" font-size="12.5" fill="#fff" text-anchor="middle">o con batería crítica.</text>
<g filter="url(#sh)"><rect x="740" y="400" width="340" height="140" rx="12" fill="#438DD5"/></g>
<text x="910.0" y="432" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Consola de operación</text>
<text x="910.0" y="452" font-size="12" fill="#fff" opacity=".85" text-anchor="middle">[Contenedor: SPA HTML/JS]</text>
<text x="910.0" y="476" font-size="12.5" fill="#fff" text-anchor="middle">Mapa de zonas, configuración de rutas,</text>
<text x="910.0" y="493" font-size="12.5" fill="#fff" text-anchor="middle">monitoreo por tramo y reportes.</text>
<g filter="url(#sh)"><rect x="740" y="640" width="340" height="180" rx="12" fill="#1168BD"/></g>
<text x="910.0" y="672" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Aplicación principal</text>
<text x="910.0" y="692" font-size="12" fill="#fff" opacity=".85" text-anchor="middle">[Contenedor: Java 17 · dominio + aplicación]</text>
<text x="910.0" y="716" font-size="12.5" fill="#fff" text-anchor="middle">Planifica la ruta (Chain de validación),</text>
<text x="910.0" y="733" font-size="12.5" fill="#fff" text-anchor="middle">asigna un drone por tramo, reasigna</text>
<text x="910.0" y="750" font-size="12.5" fill="#fff" text-anchor="middle">ante fallos y lleva la cadena de custodia.</text>
<g filter="url(#sh)"><rect x="320" y="650" width="260" height="160" rx="12" fill="#438DD5"/></g>
<text x="450.0" y="682" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Módulo de telemetría</text>
<text x="450.0" y="702" font-size="12" fill="#fff" opacity=".85" text-anchor="middle">[Contenedor: Java 17]</text>
<text x="450.0" y="726" font-size="12.5" fill="#fff" text-anchor="middle">Recibe lecturas de batería</text>
<text x="450.0" y="743" font-size="12.5" fill="#fff" text-anchor="middle">y posición (Decorator</text>
<text x="450.0" y="760" font-size="12.5" fill="#fff" text-anchor="middle">DroneConMonitoreo).</text>
<g filter="url(#sh)"><rect x="1150" y="960" width="310" height="150" rx="12" fill="#438DD5"/></g>
<text x="1305.0" y="992" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Adaptador API hídrica</text>
<text x="1305.0" y="1012" font-size="12" fill="#fff" opacity=".85" text-anchor="middle">[Contenedor: Java 17 + Jackson]</text>
<text x="1305.0" y="1036" font-size="12.5" fill="#fff" text-anchor="middle">Traduce waterLevel, turbidity y</text>
<text x="1305.0" y="1053" font-size="12.5" fill="#fff" text-anchor="middle">waveHeight a NivelAgua, Turbidez</text>
<text x="1305.0" y="1070" font-size="12.5" fill="#fff" text-anchor="middle">y NivelAgitacion (Adapter).</text>
