<text x="40" y="52" font-size="30" font-weight="700" fill="#0A1F3C">[Diagrama de Contexto C4 – Nivel 1] AquaPort v2 (Prinplup)</text>
<text x="40" y="82" font-size="16" fill="#5A6B7F">15 drones de 3 tipos · asignación automática según zona y condiciones del agua · alertas en tiempo real</text>
